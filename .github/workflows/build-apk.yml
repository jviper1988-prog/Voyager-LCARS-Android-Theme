name: Build Ember Citadel
on:
  push:
    branches: [ember-citadel-prototype]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fetch licensed heading font from designer
        run: python3 scripts/fetch_font.py
      - name: Test, build and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ember-Citadel-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ember-Citadel-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
