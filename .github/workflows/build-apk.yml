name: Build Voyager LCARS APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android Platform 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check interface logic
        run: node tests/ui-logic.cjs
      - name: Compile debug launcher
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voyager-LCARS-installable-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

